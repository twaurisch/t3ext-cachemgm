name: Tests

on: [ push, pull_request ]

jobs:
  PHPUnit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # TYPO3 v12 combinations (supports PHP 8.1-8.4, 8.5 experimental)
          - typo3: '^12.4'
            php: '8.2'
          - typo3: '^12.4'
            php: '8.3'
          - typo3: '^12.4'
            php: '8.4'
          - typo3: '^12.4'
            php: '8.5'
            allow-failure: true
          # TYPO3 v13 combinations (supports PHP 8.2-8.4, 8.5 experimental)
          - typo3: '^13.4'
            php: '8.2'
          - typo3: '^13.4'
            php: '8.3'
          - typo3: '^13.4'
            php: '8.4'
          - typo3: '^13.4'
            php: '8.5'
            allow-failure: true

    name: TYPO3 ${{ matrix.typo3 }} / PHP ${{ matrix.php }}

    continue-on-error: ${{ matrix.allow-failure == true }}

    steps:
      - name: Start database server
        run: sudo /etc/init.d/mysql start

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up PHP Version ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Environment Check
        run: |
          php --version
          composer --version

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies with typo3/cms-core:${{ matrix.typo3 }}
        run: |
          composer require --dev typo3/cms-core:${{ matrix.typo3 }} --no-progress
          git checkout composer.json

      - name: Lint PHP
        run: find . -name \*.php ! -path "./.Build/*" ! -path "./scripts/*" ! -path "./typo3_src/*" | parallel --gnu php -d display_errors=stderr -l {} > /dev/null \;

      - name: Unit Tests
        run: |
          export "UNIT_XML"=.Build/vendor/typo3/testing-framework/Resources/Core/Build/UnitTests.xml
          .Build/bin/phpunit --colors -c $UNIT_XML Tests/Unit

      - name: Functional Tests
        run: |
          export "FUNCTIONAL_XML"=Tests/Functional/FunctionalTests.xml
          .Build/bin/phpunit --colors -c $FUNCTIONAL_XML Tests/Functional
        env:
          typo3DatabaseHost: 127.0.0.1
          typo3DatabaseName: typo3
          typo3DatabasePassword: root
          typo3DatabaseUsername: root
